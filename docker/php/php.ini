; Configuración de PHP para sistemabase
date.timezone = America/Argentina/Jujuy

memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_vars = 5000

; $_ENV disponible para que CodeIgniter lea las variables del contenedor
variables_order = "EGPCS"

display_errors = Off
log_errors = On

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
